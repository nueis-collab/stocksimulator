<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f16">
<title>나의 투자 유형</title>
<style>
:root{color-scheme:dark;--bg:#0b0f16;--panel:#141a24;--muted:#9aa5b8;--line:#222b3a;--red:#ff4d5a;--blue:#4d8dff;--gold:#ffb020;--teal:#2ec4b6}
*{box-sizing:border-box}
body{margin:0;background:#080c12;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;padding:20px 12px}
.app{max-width:860px;margin:auto;background:var(--bg);border-radius:20px;padding:18px;min-height:90vh}
header{font-size:23px;font-weight:850;margin:4px 2px 18px}
.card{background:var(--panel);border-radius:16px;padding:16px;margin:9px 0}
.big{font-size:24px;font-weight:850;margin-bottom:7px}
.sub{color:var(--muted);font-size:14px;line-height:1.65}
.question{font-size:23px;font-weight:800;line-height:1.5;margin:16px 0 8px}
.em{font-size:38px;letter-spacing:5px;margin:10px 0}
button{border:0;border-radius:13px;padding:16px 18px;font-size:17px;font-weight:800;cursor:pointer;color:white;min-height:54px}
button:active{transform:scale(.985)}
.primary{background:var(--red)}.blue{background:var(--blue)}.neutral{background:#293243;color:#e8edf5}
.btnrow{display:flex;gap:10px;margin-top:14px}.btnrow button{flex:1}
.bar{height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:9px}
.fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.result-name{font-size:48px;font-weight:900;line-height:1.2;margin:8px 0}
.center{text-align:center}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.legend-item{font-size:14px;margin:7px 0;color:#e5eaf2}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
input[type=range]{width:100%;accent-color:var(--red);margin:8px 0 16px}
.range-head{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-top:10px}
.range-head strong{color:#fff}
.slider-block{padding:5px 0}
.stack{display:flex;height:18px;border-radius:8px;overflow:hidden;background:var(--line);margin:10px 0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--panel);border-radius:14px;padding:13px;text-align:center;min-width:0}
.metric .value{font-size:clamp(17px,4vw,24px);font-weight:900;margin:8px 0;overflow-wrap:anywhere}
.up{color:var(--red);font-size:13px;font-weight:700}.down{color:var(--blue);font-size:13px;font-weight:700}
.ai{background:#141a24;border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;margin:8px 0;line-height:1.65;font-size:14px}
.ai b{display:block;margin-bottom:3px}
svg{max-width:100%;height:auto}
.small-note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}
input[type=range]:disabled{opacity:.35}
@media(max-width:520px){body{padding:0}.app{border-radius:0;padding:14px;min-height:100vh}.metrics{grid-template-columns:1fr}.metric{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}.metric .value{margin:0}.btnrow{gap:7px}.btnrow button{font-size:15px;padding:13px 8px}.question{font-size:21px}}
</style>
</head>
<body>
<main class="app">
<header>📊 나의 투자 유형</header>
<div id="screen"></div>
</main>
<script>
"use strict";
const AS=["채권","저금","주식","코인","부동산"];
const IC=["📜","💰","📈","🪙","🏠"];
const CO=["#4d8dff","#8b95a7","#ff4d5a","#ffb020","#2ec4b6"];
const RET=[.035,.025,.08,.15,.05], VOL=[.05,.005,.30,1.10,.14];
const JP=[0,0,.03,.06,.012], UP=[0,0,.45,1.5,.25], DN=[0,0,.35,.65,.20];
const TY=[
 ["안전형","🛡️💰📉","안전이 제일이야","돈이 줄어드는 게 제일 싫은 신중한 타입이에요.",[35,35,10,0,20],"#4d8dff",[.50,.52,.51,.54,.55,.57,.58,.60]],
 ["꾸준형","📅📈💹","조금씩 꾸준히","매달 조금씩 모으는 성실한 타입이에요.",[25,15,30,0,30],"#2ec4b6",[.10,.20,.28,.38,.47,.58,.70,.82]],
 ["분석형","🔍📊💹","나눠서 똑똑하게","여러 곳에 나눠 담는 분석가 타입이에요.",[20,10,30,10,30],"#b388ff",[.30,.45,.35,.50,.45,.60,.55,.70]],
 ["도전형","🔥💹🚀","도전하는 용기","위험이 있어도 기회를 잡으러 가는 타입이에요.",[10,5,50,20,15],"#ffb020",[.20,.50,.30,.70,.45,.85,.60,.95]],
 ["승부형","🎯🚀💥","한 방을 노려","큰 기회에 집중하는 승부사 타입이에요.",[0,0,40,50,10],"#ff4d5a",[.50,.55,.20,.30,.10,.60,.45,1.0]]
];
const Q=[
 ["용돈을 받으면 바로 쓰기보다 모아두는 편이야?",{0:2,1:1}],
 ["친구가 대박이라고 해도 한 번 더 확인하고 결정해?",{2:2,0:1}],
 ["매달 정해진 날에 조금씩 저금하는 게 좋아?",{1:2,0:1}],
 ["게임 아이템도 여러 종류를 골고루 모으는 걸 좋아해?",{2:2,1:1}],
 ["가진 돈이 줄어들면 잠이 안 올 것 같아?",{0:2}],
 ["위험해도 크게 이길 수 있다면 도전해 볼래?",{3:2,4:1}],
 ["큰 기회라면 가진 걸 한 번에 걸어볼 수 있어?",{4:2,3:1}],
 ["새로운 걸 남들보다 먼저 해보는 게 좋아?",{3:2,4:1}],
 ["오래 기다려야 큰 보상이 와도 괜찮아?",{1:2,2:1}],
 ["여러 개를 하는 것보다 하나에 집중하는 게 좋아?",{4:2,3:1}]
];
const SEC={
 "반도체":["💾","경기를 많이 타서 크게 오르고 크게 내려요"],
 "2차전지":["🔋","성장 기대가 크지만 흔들림도 커요"],
 "바이오":["🧬","결과에 따라 급등락이 심한 편이에요"],
 "철강":["🏗️","경기를 타지만 배당을 주는 곳이 많아요"],
 "서비스":["🛎️","통신·플랫폼·금융처럼 비교적 꾸준해요"],
 "음식":["🍜","사람들이 늘 먹어서 비교적 안정적이에요"]
};
const MIX=[
 {"음식":40,"서비스":30,"철강":20,"반도체":10},
 {"서비스":35,"음식":25,"철강":20,"반도체":20},
 {"반도체":30,"서비스":25,"바이오":15,"철강":15,"음식":15},
 {"반도체":40,"2차전지":30,"바이오":20,"서비스":10},
 {"2차전지":40,"바이오":35,"반도체":25}
];
let state={i:0,sc:[0,0,0,0,0],type:0,config:{mon:30,yrs:10,goal:3000,alloc:[0,100,0,0,0]}};
const screen=document.getElementById("screen");
const money=v=>Math.abs(v)>=10000?(v/10000).toLocaleString("ko-KR",{maximumFractionDigits:1})+"억원":Math.round(v).toLocaleString("ko-KR")+"만원";
const card=html=>`<section class="card">${html}</section>`;
function show(...parts){screen.innerHTML=parts.join("");}
function button(label,cls,action){return `<button class="${cls}" data-action="${action}">${label}</button>`;}
screen.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="start")start();if(a==="yes")reply(1);if(a==="no")reply(0);
 if(a==="goal")goal();if(a==="next")finishSetup();if(a==="recommend")recommend();
 if(a==="again")start();
});
function start(){
 state.i=0;state.sc=[0,0,0,0,0];state.config.alloc=[0,100,0,0,0];ask();
}
function welcome(){
 show(card(`<div class="big">나는 어떤 투자 유형일까?</div><div class="sub">질문 10개에 네 또는 아니요로 답해 보세요.</div><div class="em">📉📈📊💹🚀</div>`),
 button("시작하기 ▶","primary","start"));
}
function ask(){
 const i=state.i;
 show(card(`<div class="sub">질문 ${i+1} / ${Q.length}</div><div class="bar"><div class="fill" style="width:${(i+1)*10}%"></div></div><div class="question">${Q[i][0]}</div>`),
 `<div class="btnrow">${button("네 👍","primary","yes")}${button("아니요 👎","blue","no")}</div>`);
}
function reply(yes){
 if(yes)for(const [t,p] of Object.entries(Q[state.i][1]))state.sc[Number(t)]+=p;
 state.i++;
 if(state.i<Q.length)ask();else{state.type=state.sc.indexOf(Math.max(...state.sc));resultType();}
}
function donut(title,labels,vals,cols){
 const total=vals.reduce((a,b)=>a+b,0)||1;let angle=-Math.PI/2,paths="";
 vals.forEach((v,i)=>{
  const f=v/total;if(f<=0)return;
  if(f>.9999){paths+=`<circle cx="100" cy="100" r="70" fill="none" stroke="${cols[i]}" stroke-width="38"/>`;return;}
  const end=angle+Math.PI*2*f,pt=(r,a)=>[100+r*Math.cos(a),100+r*Math.sin(a)];
  const [x1,y1]=pt(89,angle),[x2,y2]=pt(89,end),[x3,y3]=pt(51,end),[x4,y4]=pt(51,angle);
  paths+=`<path d="M${x1} ${y1} A89 89 0 ${f>.5?1:0} 1 ${x2} ${y2} L${x3} ${y3} A51 51 0 ${f>.5?1:0} 0 ${x4} ${y4} Z" fill="${cols[i]}" stroke="#141a24" stroke-width="2"/>`;angle=end;
 });
 const legend=labels.map((l,i)=>`<div class="legend-item"><span class="dot" style="background:${cols[i]}"></span>${l} <b>${Math.round(vals[i]/total*100)}%</b></div>`).join("");
 return card(`<b>${title}</b><div class="donut-wrap"><svg viewBox="0 0 200 200" width="190">${paths}</svg><div>${legend}</div></div>`);
}
function spark(points,color){
 const coords=points.map((v,i)=>`${10+i*300/(points.length-1)},${110-v*100}`).join(" ");
 return `<svg viewBox="0 0 320 120" width="100%"><polygon points="10,110 ${coords} 310,110" fill="${color}" opacity=".18"/><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="310" cy="${110-points.at(-1)*100}" r="6" fill="${color}"/></svg>`;
}
function resultType(){
 const [name,em,title,desc,alloc,color,sp]=TY[state.type];
 const vals=state.sc.reduce((a,b)=>a+b,0)?state.sc:[1,1,1,1,1];
 const ids=vals.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
 const d1=donut(`내 답변으로 본 유형 비율 (1등: ${name})`,ids.map(i=>TY[i][0]),ids.map(i=>vals[i]),ids.map(i=>TY[i][5]));
 const keep=alloc.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
 const d2=donut(`${name}에게 추천하는 투자 비율`,keep.map(i=>AS[i]),keep.map(i=>alloc[i]),keep.map(i=>CO[i]));
 show(card(`<div class="center" style="border:2px solid ${color};border-radius:15px;padding:14px"><div class="sub">나의 투자 유형은</div><div class="result-name" style="color:${color}">${name}</div><b>${title}</b><div style="margin:12px 0">${spark(sp,color)}</div><div class="em">${em}</div><div class="sub">${desc}</div></div>`),d1,d2,button("다음: 목표 정하기 ▶","primary","goal"));
}
function goal(){
 const c=state.config;
 const ranges=[
  ["mon","매달 투자할 돈(만원)",5,300,5],
  ["yrs","투자 기간(년)",1,30,1],
  ["goal","목표 금액(만원)",100,100000,100]
 ];
 let rangeHtml=ranges.map(([k,label,min,max,step])=>`<div class="slider-block"><div class="range-head"><label for="${k}">${label}</label><strong id="${k}val">${Number(c[k]).toLocaleString("ko-KR")}</strong></div><input id="${k}" type="range" min="${min}" max="${max}" step="${step}" value="${c[k]}"></div>`).join("");
 let allocHtml=AS.map((a,i)=>`<div class="slider-block"><div class="range-head"><label for="a${i}">${IC[i]} ${a} (%)</label><strong id="a${i}val">${c.alloc[i]}%</strong></div><input id="a${i}" type="range" min="0" max="100" step="5" value="${c.alloc[i]}" ${i===1?"disabled":""}></div>`).join("");
 show(card(`<b>💵 매달 얼마를, 몇 년 동안, 얼마까지?</b>${rangeHtml}<div class="sub" id="savingInfo"></div>`),
 card(`<b>🪙 어디에 얼마씩?</b><div class="sub">처음엔 저금 100%예요. 다른 종목을 조절하면 남은 비율은 저금으로 자동 배정됩니다.</div>${allocHtml}<div id="allocationBar"></div>`),
 `<div class="btnrow">${button("✨ 유형 추천 비율 넣기","neutral","recommend")}${button("미래 보러 가기 🚀","primary","next")}</div>`);
 ranges.forEach(([k])=>document.getElementById(k).addEventListener("input",e=>{c[k]=Number(e.target.value);document.getElementById(k+"val").textContent=Number(c[k]).toLocaleString("ko-KR");updateGoalInfo();}));
 for(let i=0;i<5;i++)if(i!==1)document.getElementById("a"+i).addEventListener("input",()=>changeAlloc(i));
 updateGoalInfo();drawAllocation();
}
function updateGoalInfo(){const c=state.config;document.getElementById("savingInfo").innerHTML=`${c.yrs}년 동안 넣는 돈은 <b style="color:white">${money(c.mon*12*c.yrs)}</b>, 목표는 <b style="color:#ffb020">${money(c.goal)}</b>입니다.`;}
function changeAlloc(i){
 const c=state.config;let v=c.alloc.slice();v[i]=Number(document.getElementById("a"+i).value);
 let excess=v.reduce((s,x,j)=>s+(j===1?0:x),0)-100;
 while(excess>0){let candidates=[0,2,3,4].filter(j=>j!==i&&v[j]>0);if(!candidates.length)break;let j=candidates.sort((a,b)=>v[b]-v[a])[0];let d=Math.min(5,excess,v[j]);v[j]-=d;excess-=d;}
 v[1]=100-v.reduce((s,x,j)=>s+(j===1?0:x),0);c.alloc=v;
 for(let j=0;j<5;j++){document.getElementById("a"+j).value=v[j];document.getElementById("a"+j+"val").textContent=v[j]+"%";}
 drawAllocation();
}
function drawAllocation(){
 const v=state.config.alloc;const seg=v.map((n,i)=>n?`<div style="width:${n}%;background:${CO[i]}"></div>`:"").join("");
 const labels=v.map((n,i)=>n?`${IC[i]} ${AS[i]} ${n}%`:"").filter(Boolean).join("　");
 document.getElementById("allocationBar").innerHTML=`<div class="sub">내 투자 비율 (합계 ${v.reduce((a,b)=>a+b,0)}%)</div><div class="stack">${seg}</div><div class="sub">${labels}</div>`;
}
function recommend(){state.config.alloc=TY[state.type][4].slice();goal();}
function randn(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function simulate(w,mon,yrs,n=2000){
 const months=yrs*12,paths=new Array(n),finals=new Array(n);
 const sig=VOL.map(v=>v/Math.sqrt(12));
 for(let p=0;p<n;p++){
  let value=0,arr=new Float64Array(months+1);arr[0]=0;
  for(let t=0;t<months;t++){
   let port=0;
   for(let j=0;j<5;j++){
    const s=sig[j],growth=Math.exp(Math.log(1+RET[j])/12-.5*s*s+s*randn());
    const u=Math.random(),jump=u<JP[j]/2?1+UP[j]:u>1-JP[j]/2?1-DN[j]:1;
    const adjusted=growth*jump/(1+JP[j]/2*(UP[j]-DN[j]));
    port+=w[j]*adjusted;
   }
   value=value*port+mon;arr[t+1]=value;
  }
  paths[p]=arr;finals[p]=value;
 }
 finals.sort((a,b)=>a-b);
 const pct=q=>finals[Math.min(n-1,Math.floor((n-1)*q))];
 const bands=Array.from({length:months+1},(_,t)=>{
  const col=paths.map(p=>p[t]).sort((a,b)=>a-b);
  return [col[Math.floor((n-1)*.1)],col[Math.floor((n-1)*.5)],col[Math.floor((n-1)*.9)]];
 });
 return {p10:pct(.1),p50:pct(.5),p90:pct(.9),prob:finals.filter(v=>v>=state.config.goal).length/n,bands};
}
function lineChart(bands,goal,yrs,mon){
 const W=640,H=280,ml=75,mr=12,mt=15,mb=28;
 const maxBand=Math.max(...bands.map(x=>x[2]),1),showGoal=goal<=maxBand*2.5,hi=Math.max(maxBand,showGoal?goal:0)*1.06;
 const sx=i=>ml+i/(bands.length-1)*(W-ml-mr),sy=v=>mt+(1-v/hi)*(H-mt-mb);
 let g="";
 for(let k=0;k<=4;k++){let v=hi*k/4,y=sy(v);g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#222b3a"/><text x="${ml-7}" y="${y+4}" fill="#9aa5b8" font-size="11" text-anchor="end">${money(v)}</text>`;}
 for(let k=0;k<=5;k++){let idx=Math.round((bands.length-1)*k/5);g+=`<text x="${sx(idx)}" y="${H-7}" fill="#9aa5b8" font-size="11" text-anchor="middle">${(yrs*k/5).toFixed(yrs<5?1:0)}년</text>`;}
 const upper=bands.map((b,i)=>`${sx(i)},${sy(b[2])}`).join(" "),lower=bands.map((b,i)=>`${sx(bands.length-1-i)},${sy(bands[bands.length-1-i][0])}`).join(" ");
 g+=`<polygon points="${upper} ${lower}" fill="#96a0c8" opacity=".15"/>`;
 const line=(idx,color,width,dash="")=>`<polyline points="${bands.map((b,i)=>`${sx(i)},${sy(b[idx])}`).join(" ")}" fill="none" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:""}/>`;
 g+=line(2,"#ff4d5a",2)+line(1,"#ffd166",4)+line(0,"#4d8dff",2);
 g+=`<polyline points="${bands.map((b,i)=>`${sx(i)},${sy(mon*i)}`).join(" ")}" fill="none" stroke="#8b95a7" stroke-width="2" stroke-dasharray="4 4"/>`;
 if(showGoal)g+=`<line x1="${ml}" x2="${W-mr}" y1="${sy(goal)}" y2="${sy(goal)}" stroke="#2ec4b6" stroke-width="2" stroke-dasharray="6 4"/>`;
 return card(`<b>시간에 따른 내 돈</b><svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="sub">🔴 운 좋을 때　🟡 보통　🔵 운 나쁠 때　회색 점선: 내가 넣은 돈</div>${showGoal?"":`<div class="small-note">목표 금액은 그래프 범위보다 높아 표시하지 않았어요.</div>`}`);
}
function sectorText(w,t){
 if(w[2]<.005)return "주식 비중이 0%라서 분야 추천은 없어요. 주식을 넣으면 분야도 알려드릴게요.";
 const mix=MIX[t],sp=w[2]*100,top=Object.keys(mix).sort((a,b)=>mix[b]-mix[a])[0];
 const chips=Object.entries(mix).map(([k,v])=>`${SEC[k][0]} ${k} ${v}%`).join(" · ");
 const hot=["반도체","2차전지","바이오"].filter(k=>mix[k]>=30);
 return `주식 ${sp.toFixed(0)}% 안에서 이렇게 나눠 볼 수 있어요.<br>${chips}<br>가장 큰 ${SEC[top][0]} ${top}: ${SEC[top][1]}. 전체 돈으로 보면 약 ${(sp*mix[top]/100).toFixed(1)}%예요.${hot.length?" "+hot.join(", ")+"은(는) 흔들림이 커서 비중이 크면 조심해요.":""}<br><span class="small-note">분야 예시일 뿐 특정 회사를 추천하는 것이 아니에요.</span>`;
}
function finishSetup(){
 const c=state.config,w=c.alloc.map(v=>v/100),base=TY[state.type][4].map(v=>v/100);
 const r=simulate(w,c.mon,c.yrs),invested=c.mon*12*c.yrs,pp=Math.round(r.prob*100);
 const metric=(emoji,label,val)=>`<div class="metric"><div class="sub">${emoji} ${label}</div><div class="value">${money(val)}</div><div class="${val>=invested?"up":"down"}">${val>=invested?"▲":"▼"} ${money(Math.abs(val-invested))}</div></div>`;
 const risk=w.reduce((s,v,i)=>s+v*VOL[i],0),baseRisk=base.reduce((s,v,i)=>s+v*VOL[i],0);
 let t1=w[1]>=.95?"거의 저금만 하는 아주 안전한 방법이에요. 마음은 편하지만 돈이 거의 불어나지 않아요.":risk>baseRisk*1.4+.03?"꽤 공격적인 방법이에요. 크게 떨어질 때 놀라서 팔면 손해가 굳어질 수 있어요.":risk<baseRisk*.6?`내 유형보다 많이 조심스러운 방법이에요. 마음은 편하지만 목표까지 오래 걸릴 수 있어요.`:`${TY[state.type][0]}과 잘 어울리는 방법이에요. 오래 이어가기 좋은 구성이에요.`;
 let t2=`목표 달성 확률은 ${pp}%예요. `+(r.prob>=.8?"시뮬레이션상 목표에 도달한 경우가 많았어요.":r.prob>=.5?"해볼 만하지만 운이 나쁘면 목표에 모자랄 수 있어요.":"현재 설정으로는 목표 달성이 쉽지 않게 나타났어요.");
 let t3=`운이 좋을 때와 나쁠 때의 결과는 약 ${(r.p90/Math.max(r.p10,1)).toFixed(1)}배 차이예요. `+(r.p10<invested?"운이 나쁜 경우 넣은 돈보다 적어질 수도 있어요.":"이번 시뮬레이션의 하위 결과에서도 넣은 돈보다 높게 나타났어요.");
 let tip="계획을 세울 때는 예상 수익뿐 아니라 손실 가능성과 꾸준히 이어갈 수 있는지도 함께 생각해 보세요.";
 if(r.prob<.7)tip+=" 목표 금액을 낮추거나 투자 기간을 늘리는 경우도 비교해 보세요.";
 if(Math.max(...w)>=.8&&w.indexOf(Math.max(...w))!==1)tip+=" 한 곳에 비중이 몰리면 해당 자산의 변동에 크게 영향을 받아요.";
 if(w[3]>0)tip+=" 코인은 크게 흔들릴 수 있으니 시뮬레이션의 가정과 위험을 꼭 함께 살펴보세요.";
 const off=AS.filter((a,i)=>w[i]>0&&base[i]===0&&i!==1);if(off.length)tip+=` ${off.join(", ")}은(는) 내 유형의 기본 추천 비율에 포함되지 않은 투자처예요.`;
 const chips=w.map((v,i)=>v>=.005?`${IC[i]} ${AS[i]} ${(v*100).toFixed(0)}%`:null).filter(Boolean).join("　");
 show(card(`<div class="sub">${TY[state.type][0]} · 내가 정한 비율</div><div class="big">${c.yrs}년 뒤 내 돈</div><div class="sub">${chips}</div>`),
 `<div class="metrics">${metric("😢","운 나쁠 때",r.p10)}${metric("🙂","보통일 때",r.p50)}${metric("😆","운 좋을 때",r.p90)}</div><div class="sub" style="margin:8px 2px">화살표는 내가 넣은 돈 ${money(invested)}과 비교한 결과예요.</div>`,
 card(`<div class="sub">목표 ${money(c.goal)} 달성 확률</div><div class="big">${r.prob>=.8?"🎉":r.prob>=.5?"🙂":"😥"} ${pp}%</div><div class="bar"><div class="fill" style="width:${Math.max(pp,2)}%"></div></div>`),
 card(`<div class="big" style="font-size:20px">🤖 AI 코치의 분석</div><div class="ai"><b>🧭 유형 분석</b>${t1}</div><div class="ai"><b>🎯 목표 분석</b>${t2}</div><div class="ai"><b>⚠️ 위험 체크</b>${t3}</div><div class="ai"><b>💡 이렇게 해봐요</b>${tip}</div><div class="ai"><b>🏭 분야 추천</b>${sectorText(w,state.type)}</div><div class="small-note">이 앱의 코치 분석은 설정값과 가정에 따라 문장을 선택하는 규칙 기반 기능이며, 실제 AI 투자 자문이 아닙니다.</div>`),
 lineChart(r.bands,c.goal,c.yrs,c.mon),
 card(`<b>시뮬레이션 안내</b><div class="small-note">이 결과는 임의로 설정한 연 수익률과 변동성, 무작위 시장 변동을 바탕으로 계산한 공부용 예시입니다. 실제 시장의 움직임이나 미래 수익을 예측하지 않으며, 투자 권유 또는 조언이 아닙니다. 원본 코드의 초기 투자금 0만원 설정을 유지했습니다.</div>`),
 `<div class="btnrow">${button("🎯 목표 다시 정하기","neutral","goal")}${button("🔄 처음부터","neutral","again")}</div>`);
}
welcome();
</script>
